[build-system]
requires = [ "poetry-core>=1.0.0",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
version = "0.1.0"
name = "destination-anonymization"
description = "Destination implementation for data anonymization with comprehensive privacy features."
authors = [ "Airbyte <contact@airbyte.io>",]
license = "MIT"
readme = "README.md"
documentation = "https://docs.airbyte.com/integrations/destinations/anonymization"
homepage = "https://airbyte.com"
repository = "https://github.com/airbytehq/airbyte"

[[tool.poetry.packages]]
include = "destination_anonymization"

[tool.poetry.dependencies]
python = "^3.10,<3.13"
airbyte-cdk = "^6.36.4"
faker = "^26.0.0"
pyyaml = "^6.0.1"
cryptography = "^42.0.0"

[tool.poetry.scripts]
destination-anonymization = "destination_anonymization.run:run"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-mock = "^3.12.0"

[tool.poe]
include = [
    "${POE_GIT_DIR}/poe-tasks/poetry-connector-tasks.toml",
]
